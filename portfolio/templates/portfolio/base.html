{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Lab</title>
<link rel="stylesheet" href="{% static 'vendor/katex/katex.min.css' %}">
<style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;line-height:1.5;color:#202a35}nav{display:flex;gap:1rem;align-items:center}table{border-collapse:collapse;width:100%}th,td{padding:.5rem;text-align:left;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:1rem}.note{padding:1rem;background:#eef3f8}input,select,textarea,button{font:inherit;padding:.4rem}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}.formula{overflow-x:auto}form p{display:flex;flex-direction:column}.errorlist{color:#a22}details{margin:1rem 0}.wide-chart{grid-column:1/-1}.chart-dialog{width:94vw;max-width:none;height:92vh;border:0}.chart-dialog::backdrop{background:#0009}.chart-frame{min-width:0}.chart-frame button{margin-right:.5rem}table table{font-size:.9em}nav{flex-wrap:wrap}</style>
<script defer src="{% static 'vendor/katex/katex.min.js' %}"></script><script defer src="{% static 'portfolio/lab.js' %}"></script></head><body>
<header><h1>Portfolio Lab</h1><nav><a href="{% url 'home' %}">Research</a><a href="{% url 'results' %}">Results</a><a href="{% url 'compare' %}">Compare</a><a href="{% url 'paper' %}">Paper sessions</a>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>{% endif %}</nav></header>
{% for message in messages %}<p class="note">{{ message }}</p>{% endfor %}<main>{% block content %}{% endblock %}</main></body></html>
